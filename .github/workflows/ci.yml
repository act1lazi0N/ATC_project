name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GHCR_IMAGE: ghcr.io/act1lazi0n/atc_project

jobs:
  workflow-policy:
    name: Workflow policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate workflows
        shell: bash
        run: |
          actionlint_path="$(go env GOPATH)/bin/actionlint"
          "$actionlint_path"

      - name: Enforce immutable action references
        shell: bash
        run: |
          set -euo pipefail
          # Match pull_request_target: as a YAML key (line starts with optional whitespace + key name + colon)
          # This regex anchors to line-beginning to avoid matching this very grep command
          if grep -R --line-number -E '^\s*pull_request_target\s*:' .github/workflows 2>/dev/null | grep -v 'Enforce immutable action references'; then
            echo 'pull_request_target is forbidden for workflows that execute repository code.' >&2
            exit 1
          fi
          invalid_uses=$(grep -RhoE 'uses:[[:space:]]+[^[:space:]#]+' .github/workflows \
            | awk -F@ '!/^uses:[[:space:]]+\.\// && ($2 !~ /^[0-9a-f]{40}$/) { print }')
          if [[ -n "$invalid_uses" ]]; then
            echo 'Every external action must be pinned to a full commit SHA:' >&2
            echo "$invalid_uses" >&2
            exit 1
          fi

  source-security:
    name: Source security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate source vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-source.sarif
          exit-code: "0"

      - name: Enforce critical source vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL
          ignore-unfixed: false
          format: table
          exit-code: "1"

      - name: Enforce fixable high source vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Upload source security report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-source-${{ github.run_id }}
          path: trivy-source.sarif
          if-no-files-found: warn
          retention-days: 14

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  maven-verify:
    name: Maven verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run full Maven verification
        env:
          CI: "true"
        run: bash ./mvnw -B -ntp clean verify

      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maven-reports-${{ github.run_id }}
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 14

  critical-financial-security:
    name: Critical financial and security tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run production-fidelity regression lane
        env:
          CI: "true"
        run: >-
          bash ./mvnw -B -ntp
          -Dtest=FlywayMigrationIntegrationTest,TransferConcurrencyIntegrationTest,RefreshSessionIntegrationTest,SecurityFilterIntegrationTest,SecurityRegressionMatrixTest,RedisCounterOperationsIntegrationTest
          test

      - name: Upload critical test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: critical-reports-${{ github.run_id }}
          path: target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 14

  codeql-java:
    name: CodeQL Java
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Build for CodeQL
        run: bash ./mvnw -B -ntp -DskipTests package

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          category: /language:java-kotlin

  pr-image:
    name: PR image security
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build local pull-request image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: aries-transaction-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate image vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aries-transaction-ci:${{ github.sha }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"

      - name: Enforce critical image vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aries-transaction-ci:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: false
          format: table
          exit-code: "1"

      - name: Enforce fixable high image vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aries-transaction-ci:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Upload image security report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-pr-image-${{ github.run_id }}
          path: trivy-image.sarif
          if-no-files-found: warn
          retention-days: 14

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - workflow-policy
      - source-security
      - dependency-review
      - maven-verify
      - critical-financial-security
      - codeql-java
      - pr-image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable CI layer
        env:
          WORKFLOW_POLICY_RESULT: ${{ needs.workflow-policy.result }}
          SOURCE_SECURITY_RESULT: ${{ needs.source-security.result }}
          MAVEN_VERIFY_RESULT: ${{ needs.maven-verify.result }}
          CRITICAL_TEST_RESULT: ${{ needs.critical-financial-security.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          CODEQL_RESULT: ${{ needs.codeql-java.result }}
          PR_IMAGE_RESULT: ${{ needs.pr-image.result }}
        shell: bash
        run: |
          set -euo pipefail
          require_success() {
            if [[ "$2" != 'success' ]]; then
              echo "$1 did not succeed: $2" >&2
              exit 1
            fi
          }
          allow_skipped() {
            if [[ "$2" != 'success' && "$2" != 'skipped' ]]; then
              echo "$1 did not succeed or skip safely: $2" >&2
              exit 1
            fi
          }
          allow_skipped_or_failed() {
            # Permits success, skipped, or failure (for optional/benign-fail checks)
            if [[ "$2" != 'success' && "$2" != 'skipped' && "$2" != 'failure' ]]; then
              echo "$1 must be success/skipped/failure, got: $2" >&2
              exit 1
            fi
          }
          require_success workflow-policy "$WORKFLOW_POLICY_RESULT"
          require_success source-security "$SOURCE_SECURITY_RESULT"
          require_success maven-verify "$MAVEN_VERIFY_RESULT"
          require_success critical-financial-security "$CRITICAL_TEST_RESULT"
          allow_skipped_or_failed dependency-review "$DEPENDENCY_REVIEW_RESULT"
          allow_skipped codeql-java "$CODEQL_RESULT"
          allow_skipped pr-image "$PR_IMAGE_RESULT"

  publish-image:
    name: Publish immutable image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci-gate
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image-ref: ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ env.GHCR_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate immutable image vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"

      - name: Enforce critical immutable image gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: false
          format: table
          exit-code: "1"

      - name: Enforce fixable high immutable image gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Attest image build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Promote digest to main channel
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools create --tag "$GHCR_IMAGE:main" "$GHCR_IMAGE@$IMAGE_DIGEST"

      - name: Write release evidence
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "commit=$GITHUB_SHA"
            echo "image=$GHCR_IMAGE@$IMAGE_DIGEST"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee release-evidence.txt

      - name: Upload image evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            release-evidence.txt
            trivy-image.sarif
          if-no-files-found: warn
          retention-days: 30

  deploy-staging:
    name: Deploy staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - ci-gate
      - publish-image
    uses: ./.github/workflows/deploy-compose.yml
    with:
      target_environment: staging
      image_ref: ${{ needs.publish-image.outputs.image-ref }}
    secrets: inherit

  release-candidate:
    name: Release candidate
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - publish-image
      - deploy-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require packaging and staging proof
        env:
          PUBLISH_RESULT: ${{ needs.publish-image.result }}
          DEPLOY_RESULT: ${{ needs.deploy-staging.result }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_IMAGE: ${{ needs.publish-image.outputs.image-ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PUBLISH_RESULT" = 'success'
          test "$DEPLOY_RESULT" = 'success'
          {
            echo '### Release candidate ready'
            echo "- Commit: \`$RELEASE_COMMIT\`"
            echo "- Image: \`$RELEASE_IMAGE\`"
            echo '- Staging deployment and read-safe smoke checks passed.'
          } >> "$GITHUB_STEP_SUMMARY"
