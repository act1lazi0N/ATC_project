services:
  postgres:
    image: postgres:16-alpine
    container_name: transfer_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - transfer_net
  redis:
    image: redis:7-alpine
    container_name: transfer_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --save "" --appendonly no
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transfer_net

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [ "notification" ]
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - transfer_net

  app:
    image: ${APP_IMAGE:-aries-transaction-project:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transfer_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # DataSource
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SECURITY_EPHEMERAL_KEY_HASH_SECRET: ${SECURITY_EPHEMERAL_KEY_HASH_SECRET:?SECURITY_EPHEMERAL_KEY_HASH_SECRET is required}

      # Flyway
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration

      # JWT
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_COOKIE_SECURE: ${JWT_REFRESH_COOKIE_SECURE:-false}
      AUTH_REFRESH_ALLOWED_ORIGINS: ${AUTH_REFRESH_ALLOWED_ORIGINS:-http://localhost:3000}

      # Financial workflow policies
      ACCOUNT_MAX_ACTIVE_ACCOUNTS_PER_USER: ${ACCOUNT_MAX_ACTIVE_ACCOUNTS_PER_USER:-5}
      TRANSFER_PREVIEW_TTL_MINUTES: ${TRANSFER_PREVIEW_TTL_MINUTES:-5}
      TRANSFER_PREVIEW_RATE_LIMIT_WINDOW_SECONDS: ${TRANSFER_PREVIEW_RATE_LIMIT_WINDOW_SECONDS:-60}
      TRANSFER_PREVIEW_USER_REQUESTS: ${TRANSFER_PREVIEW_USER_REQUESTS:-30}
      TRANSFER_PREVIEW_IP_REQUESTS: ${TRANSFER_PREVIEW_IP_REQUESTS:-120}
      TRANSFER_PREVIEW_MINIMUM_RESPONSE_MILLIS: ${TRANSFER_PREVIEW_MINIMUM_RESPONSE_MILLIS:-50}
      TRANSFER_PREVIEW_RETENTION_HOURS: ${TRANSFER_PREVIEW_RETENTION_HOURS:-24}
      TRANSFER_PREVIEW_CLEANUP_ENABLED: ${TRANSFER_PREVIEW_CLEANUP_ENABLED:-true}
      TRANSFER_PREVIEW_CLEANUP_FIXED_DELAY_MS: ${TRANSFER_PREVIEW_CLEANUP_FIXED_DELAY_MS:-3600000}

      # Durable webhook/notification fan-out and optional SMTP delivery
      OUTBOX_WORKER_ENABLED: ${OUTBOX_WORKER_ENABLED:-false}
      OUTBOX_PUBLISHER: ${OUTBOX_PUBLISHER:-noop}
      WEBHOOK_FANOUT_ENABLED: ${WEBHOOK_FANOUT_ENABLED:-false}
      NOTIFICATION_FANOUT_ENABLED: ${NOTIFICATION_FANOUT_ENABLED:-false}
      NOTIFICATION_EMAIL_MODE: ${NOTIFICATION_EMAIL_MODE:-disabled}
      NOTIFICATION_EMAIL_WORKER_ENABLED: ${NOTIFICATION_EMAIL_WORKER_ENABLED:-false}
      NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL_FROM:-no-reply@aries.local}
      NOTIFICATION_PUBLIC_BASE_URL: ${NOTIFICATION_PUBLIC_BASE_URL:-http://localhost:3000/verify-email}
      EMAIL_VERIFICATION_SIGNING_KEY: ${EMAIL_VERIFICATION_SIGNING_KEY:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_STARTTLS_ENABLE: ${SPRING_MAIL_STARTTLS_ENABLE:-false}

      # OpenAPI docs are disabled by default outside dev
      SPRINGDOC_API_DOCS_ENABLED: ${SPRINGDOC_API_DOCS_ENABLED:-false}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SPRINGDOC_SWAGGER_UI_ENABLED:-false}

      # JPA — validate schema
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate

      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - transfer_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  transfer_net:
    driver: bridge

