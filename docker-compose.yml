services:
  postgres:
    image: postgres:16-alpine
    container_name: aries_transaction_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       aries_transaction_db
      POSTGRES_USER:     aries_transaction_user
      POSTGRES_PASSWORD: aries_transaction_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aries_transaction_user -d aries_transaction_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - aries_transaction_net
  redis:
    image: redis:7-alpine
    container_name: aries_transaction_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aries_transaction_net
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aries_transaction_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aries_transaction_db
      SPRING_DATASOURCE_USERNAME: aries_transaction_user
      SPRING_DATASOURCE_PASSWORD: aries_transaction_pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS:  classpath:db/migration
      JWT_SECRET: ${JWT_SECRET:-dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBkZXY=}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate

      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - aries_transaction_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  aries_transaction_net:
    driver: bridge
