spring:
  datasource:
    url: "jdbc:h2:mem:aries_transaction_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON"
    driver-class-name: org.h2.Driver
    username: sa
    password:
  test:
    database:
      replace: none

  flyway:
    enabled: false

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.orm.schema: WARN
    org.springframework.test.context: WARN

jwt:
  secret: dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciB0ZXN0cw==
  expiration: 900
  refresh-expiration: 2592000
  refresh-cookie-secure: false
  refresh-cookie-same-site: Strict
  issuer: aries-transaction
  audience: aries-transaction-api
  token-type: access

security:
  auth-rate-limit:
    window-seconds: 60
    ip-requests: 60
    identity-requests: 10
  refresh-cookie:
    allowed-origins: http://localhost:3000

app:
  outbox:
    worker-enabled: false
    publisher: noop
    batch-size: 25
    poll-interval-ms: 5000
  reconciliation:
    expected-lag: PT0S
    max-window: P31D

identity:
  login:
    max-failed-attempts: 3
    lock-duration-seconds: 900
