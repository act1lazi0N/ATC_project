spring:
  application:
    name: aries_transaction
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:aries_transaction_db}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 250ms
      repositories:
        enabled: false
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_AUTH:false}
          connectiontimeout: ${SPRING_MAIL_CONNECTION_TIMEOUT_MS:2000}
          timeout: ${SPRING_MAIL_READ_TIMEOUT_MS:5000}
          writetimeout: ${SPRING_MAIL_WRITE_TIMEOUT_MS:5000}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE:false}
            required: ${SPRING_MAIL_STARTTLS_REQUIRED:false}
          ssl:
            checkserveridentity: ${SPRING_MAIL_SSL_CHECK_SERVER_IDENTITY:true}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900}
  refresh-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:2592000}
  refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:true}
  refresh-cookie-same-site: ${JWT_REFRESH_COOKIE_SAME_SITE:Strict}
  issuer: ${JWT_ISSUER:aries-transaction}
  audience: ${JWT_AUDIENCE:aries-transaction-api}
  token-type: access

security:
  account-security:
    enabled: ${ACCOUNT_SECURITY_ENABLED:false}
    reset-signing-key: ${PASSWORD_RESET_SIGNING_KEY:}
    reset-public-url: ${PASSWORD_RESET_PUBLIC_URL:}
    reset-ttl: ${PASSWORD_RESET_TTL:PT15M}
    forgot-email-requests: ${PASSWORD_FORGOT_EMAIL_REQUESTS:3}
    forgot-ip-requests: ${PASSWORD_FORGOT_IP_REQUESTS:20}
    forgot-window-seconds: ${PASSWORD_FORGOT_WINDOW_SECONDS:900}
    resend-seconds: ${PASSWORD_RESET_RESEND_SECONDS:60}
    minimum-response-millis: ${PASSWORD_FORGOT_MINIMUM_RESPONSE_MILLIS:200}
    retention-days: ${PASSWORD_RESET_RETENTION_DAYS:30}
    cleanup-enabled: ${PASSWORD_RESET_CLEANUP_ENABLED:true}
    cleanup-interval-ms: ${PASSWORD_RESET_CLEANUP_INTERVAL_MS:3600000}
  ephemeral:
    enabled: ${SECURITY_EPHEMERAL_ENABLED:true}
    key-prefix: ${SECURITY_EPHEMERAL_KEY_PREFIX:aries:transaction:dev:v1}
    key-hash-secret: ${SECURITY_EPHEMERAL_KEY_HASH_SECRET:${JWT_SECRET}}
    command-timeout-ms: ${SECURITY_EPHEMERAL_COMMAND_TIMEOUT_MS:250}
    duplicate-suppression-ttl-seconds: ${SECURITY_EPHEMERAL_DUPLICATE_TTL_SECONDS:30}
    replay-cache-ttl-seconds: ${SECURITY_EPHEMERAL_REPLAY_TTL_SECONDS:300}
  auth-rate-limit:
    window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
    ip-requests: ${AUTH_RATE_LIMIT_IP_REQUESTS:60}
    identity-requests: ${AUTH_RATE_LIMIT_IDENTITY_REQUESTS:10}
    trusted-proxies: ${AUTH_RATE_LIMIT_TRUSTED_PROXIES:}
  refresh-cookie:
    allowed-origins: ${AUTH_REFRESH_ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

app:
  account:
    creation:
      max-active-accounts-per-user: ${ACCOUNT_MAX_ACTIVE_ACCOUNTS_PER_USER:5}
  transfer:
    preview:
      ttl-minutes: ${TRANSFER_PREVIEW_TTL_MINUTES:5}
      rate-limit-window-seconds: ${TRANSFER_PREVIEW_RATE_LIMIT_WINDOW_SECONDS:60}
      user-requests: ${TRANSFER_PREVIEW_USER_REQUESTS:30}
      ip-requests: ${TRANSFER_PREVIEW_IP_REQUESTS:120}
      minimum-response-millis: ${TRANSFER_PREVIEW_MINIMUM_RESPONSE_MILLIS:50}
      retention-hours: ${TRANSFER_PREVIEW_RETENTION_HOURS:24}
      cleanup-enabled: ${TRANSFER_PREVIEW_CLEANUP_ENABLED:true}
      cleanup-fixed-delay-ms: ${TRANSFER_PREVIEW_CLEANUP_FIXED_DELAY_MS:3600000}
  outbox:
    worker-enabled: ${OUTBOX_WORKER_ENABLED:false}
    publisher: ${OUTBOX_PUBLISHER:noop}
    batch-size: ${OUTBOX_BATCH_SIZE:25}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:5000}
  webhook:
    fanout-enabled: ${WEBHOOK_FANOUT_ENABLED:false}
  notification:
    fanout-enabled: ${NOTIFICATION_FANOUT_ENABLED:false}
    retention-days: ${NOTIFICATION_RETENTION_DAYS:90}
    delivery-attempt-retention-days: ${NOTIFICATION_DELIVERY_ATTEMPT_RETENTION_DAYS:30}
    cleanup-enabled: ${NOTIFICATION_CLEANUP_ENABLED:true}
    cleanup-interval-ms: ${NOTIFICATION_CLEANUP_INTERVAL_MS:3600000}
    email:
      mode: ${NOTIFICATION_EMAIL_MODE:disabled}
      worker-enabled: ${NOTIFICATION_EMAIL_WORKER_ENABLED:false}
      batch-size: ${NOTIFICATION_EMAIL_BATCH_SIZE:25}
      poll-interval-ms: ${NOTIFICATION_EMAIL_POLL_INTERVAL_MS:5000}
      processing-lease: ${NOTIFICATION_EMAIL_PROCESSING_LEASE:PT5M}
      max-attempts: ${NOTIFICATION_EMAIL_MAX_ATTEMPTS:8}
      from: ${NOTIFICATION_EMAIL_FROM:}
      public-base-url: ${NOTIFICATION_PUBLIC_BASE_URL:}
      verification-signing-key: ${EMAIL_VERIFICATION_SIGNING_KEY:}
      verification-ttl: ${EMAIL_VERIFICATION_TTL:PT24H}
  reconciliation:
    expected-lag: ${RECONCILIATION_EXPECTED_LAG:PT5M}
    max-window: ${RECONCILIATION_MAX_WINDOW:P31D}
    reporting:
      mode: ${RECONCILIATION_REPORTING_MODE:disabled}
      base-url: ${RECONCILIATION_REPORTING_BASE_URL:}
      snapshots-path: ${RECONCILIATION_REPORTING_SNAPSHOTS_PATH:/api/v1/reporting/transactions/snapshots}
      connect-timeout: ${RECONCILIATION_REPORTING_CONNECT_TIMEOUT:2s}
      read-timeout: ${RECONCILIATION_REPORTING_READ_TIMEOUT:5s}

identity:
  login:
    max-failed-attempts: ${IDENTITY_LOGIN_MAX_FAILED_ATTEMPTS:5}
    lock-duration-seconds: ${IDENTITY_LOGIN_LOCK_DURATION_SECONDS:900}

logging:
  level:
    com.actilazion.aries_transaction: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: ${NOTIFICATION_EMAIL_WORKER_ENABLED:false}
    redis:
      enabled: ${SECURITY_EPHEMERAL_ENABLED:true}

