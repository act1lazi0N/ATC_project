spring:
  application:
    name: aries_transaction
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:aries_transaction_db}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400
  issuer: ${JWT_ISSUER:aries-transaction}
  audience: ${JWT_AUDIENCE:aries-transaction-api}
  token-type: access

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

app:
  outbox:
    worker-enabled: ${OUTBOX_WORKER_ENABLED:false}
    publisher: ${OUTBOX_PUBLISHER:noop}
    batch-size: ${OUTBOX_BATCH_SIZE:25}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:5000}

logging:
  level:
    com.actilazion.aries_transaction: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

